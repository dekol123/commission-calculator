services:
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: users_db
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - pgdata-users:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-accrual:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: accrual_db
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - pgdata-accrual:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d accrual_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-wallet:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: wallet_db
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - pgdata-wallet:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  users:
    build:
      context: .
      dockerfile: src/Users/Users.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres-users;Port=5432;Database=users_db;Username=app;Password=app;Maximum Pool Size=20
    ports:
      - "8081:8080"
    depends_on:
      postgres-users:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  accrual:
    build:
      context: .
      dockerfile: src/Accrual/Accrual.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres-accrual;Port=5432;Database=accrual_db;Username=app;Password=app;Maximum Pool Size=20
      Users__BaseAddress: http://users:8080/
      Wallet__BaseAddress: http://wallet:8080/
      Workers__Enabled: "false"
    ports:
      - "8082:8080"
    depends_on:
      postgres-accrual:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  accrual-worker:
    build:
      context: .
      dockerfile: src/Accrual/Accrual.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres-accrual;Port=5432;Database=accrual_db;Username=app;Password=app;Maximum Pool Size=20
      Users__BaseAddress: http://users:8080/
      Wallet__BaseAddress: http://wallet:8080/
      Workers__Enabled: "true"
    depends_on:
      postgres-accrual:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  wallet:
    build:
      context: .
      dockerfile: src/Wallet/Wallet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres-wallet;Port=5432;Database=wallet_db;Username=app;Password=app;Maximum Pool Size=20
      Accrual__BaseAddress: http://accrual:8080/
      Workers__Enabled: "false"
    ports:
      - "8083:8080"
    depends_on:
      postgres-wallet:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  wallet-worker:
    build:
      context: .
      dockerfile: src/Wallet/Wallet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres-wallet;Port=5432;Database=wallet_db;Username=app;Password=app;Maximum Pool Size=20
      Accrual__BaseAddress: http://accrual:8080/
      Payout__IntervalSeconds: "60"
      Workers__Enabled: "true"
    depends_on:
      postgres-wallet:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

volumes:
  pgdata-users:
  pgdata-accrual:
  pgdata-wallet:
